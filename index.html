<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkidGPT</title>

<style>
:root {
    --bg: #07080d;
    --panel: rgba(16,18,28,.82);
    --panel2: rgba(25,28,42,.86);
    --border: rgba(255,255,255,.09);
    --text: #f7f8ff;
    --muted: #969bb0;
    --accent: #7c5cff;
    --accent2: #00d9ff;
    --danger: #ff5577;
    --success: #42f58d;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color: var(--text);
    background: var(--bg);
}

body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background:
        radial-gradient(circle at 20% 20%,rgba(124,92,255,.20),transparent 28%),
        radial-gradient(circle at 80% 30%,rgba(0,217,255,.13),transparent 25%),
        radial-gradient(circle at 50% 90%,rgba(255,70,170,.10),transparent 30%);
    filter: blur(60px);
    animation: backgroundMove 12s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes backgroundMove {
    from { transform: translate3d(-2%,-1%,0) scale(1); }
    to { transform: translate3d(2%,2%,0) scale(1.08); }
}

button,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    position: relative;
    display: flex;
    width: 100%;
    height: 100%;
}

/* SIDEBAR */

.sidebar {
    width: 285px;
    height: 100%;
    padding: 18px;
    background: rgba(8,9,15,.78);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow: 0 0 30px rgba(124,92,255,.35);
    font-size: 20px;
    font-weight: 900;
}

.brand-text strong {
    display: block;
    font-size: 17px;
}

.brand-text span {
    color: var(--muted);
    font-size: 11px;
}

.new-chat {
    border: 1px solid rgba(255,255,255,.12);
    background: linear-gradient(135deg,rgba(124,92,255,.20),rgba(0,217,255,.08));
    color: white;
    border-radius: 14px;
    padding: 13px 15px;
    text-align: left;
    font-weight: 700;
    transition: .2s;
}

.new-chat:hover {
    transform: translateY(-1px);
    border-color: rgba(124,92,255,.5);
    box-shadow: 0 10px 35px rgba(124,92,255,.15);
}

.section-title {
    color: #777d93;
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: 10px;
    font-weight: 800;
    margin: 24px 5px 10px;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 3px;
}

.chat-item {
    position: relative;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 5px;
    border: 1px solid transparent;
    transition: .18s;
    cursor: pointer;
}

.chat-item:hover {
    background: rgba(255,255,255,.045);
    border-color: var(--border);
}

.chat-item.active {
    background: rgba(124,92,255,.12);
    border-color: rgba(124,92,255,.25);
}

.chat-title {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 22px;
}

.chat-preview {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.delete-chat {
    position: absolute;
    right: 8px;
    top: 12px;
    border: 0;
    background: transparent;
    color: #777d93;
    opacity: 0;
    font-size: 13px;
}

.chat-item:hover .delete-chat {
    opacity: 1;
}

.delete-chat:hover {
    color: var(--danger);
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(7,8,13,.48);
    backdrop-filter: blur(18px);
}

.model {
    display: flex;
    align-items: center;
    gap: 9px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 12px var(--success);
}

.model strong {
    font-size: 14px;
}

.model span {
    color: var(--muted);
    font-size: 11px;
    margin-left: 4px;
}

.top-actions button {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.035);
    color: #dfe2ef;
    border-radius: 10px;
    padding: 8px 11px;
    margin-left: 6px;
}

/* CHAT */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 38px 18px 150px;
}

.messages-inner {
    width: min(900px,100%);
    margin: auto;
}

.welcome {
    min-height: 55vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.welcome-orb {
    width: 90px;
    height: 90px;
    border-radius: 30px;
    display: grid;
    place-items: center;
    font-size: 35px;
    font-weight: 900;
    background: linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:
        0 0 40px rgba(124,92,255,.25),
        0 0 100px rgba(0,217,255,.08);
    animation: orbFloat 4s ease-in-out infinite;
}

@keyframes orbFloat {
    50% {
        transform: translateY(-8px) rotate(2deg);
    }
}

.welcome h1 {
    font-size: clamp(32px,5vw,58px);
    margin: 25px 0 10px;
    letter-spacing: -.045em;
}

.gradient-text {
    background: linear-gradient(90deg,#fff,#a996ff,#67eaff);
    -webkit-background-clip: text;
    color: transparent;
}

.welcome p {
    color: var(--muted);
    max-width: 580px;
    line-height: 1.6;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    width: min(760px,100%);
    margin-top: 25px;
}

.suggestion {
    padding: 16px;
    text-align: left;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(255,255,255,.035);
    color: #dfe2ef;
    transition: .2s;
}

.suggestion:hover {
    transform: translateY(-3px);
    border-color: rgba(124,92,255,.35);
    background: rgba(124,92,255,.08);
}

.suggestion strong {
    display: block;
    margin-bottom: 6px;
}

.suggestion span {
    color: var(--muted);
    font-size: 12px;
}

/* MESSAGES */

.message {
    display: flex;
    gap: 13px;
    margin: 24px 0;
    animation: messageIn .25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.avatar {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 900;
    background: rgba(255,255,255,.08);
}

.ai .avatar {
    background: linear-gradient(135deg,var(--accent),var(--accent2));
}

.content {
    min-width: 0;
    max-width: 88%;
}

.user .content {
    margin-left: auto;
    background: linear-gradient(135deg,rgba(124,92,255,.22),rgba(124,92,255,.10));
    border: 1px solid rgba(124,92,255,.20);
    padding: 12px 15px;
    border-radius: 16px 5px 16px 16px;
}

.ai .content {
    padding-top: 6px;
}

.text {
    white-space: pre-wrap;
    line-height: 1.65;
    font-size: 14px;
    overflow-wrap: anywhere;
}

/* GAME CHOICE */

.game-choice {
    margin-top: 12px;
    padding: 16px;
    border: 1px solid rgba(124,92,255,.25);
    border-radius: 18px;
    background: linear-gradient(
        135deg,
        rgba(124,92,255,.12),
        rgba(0,217,255,.05)
    );
}

.game-choice-title {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 5px;
}

.game-choice-subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 13px;
}

.game-choice-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.game-choice-buttons button {
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 11px;
    padding: 10px 13px;
    color: white;
    background: rgba(255,255,255,.05);
    transition: .2s;
}

.game-choice-buttons button:hover {
    transform: translateY(-2px);
    border-color: rgba(124,92,255,.5);
    background: rgba(124,92,255,.14);
}

.game-choice-buttons .primary {
    background: linear-gradient(135deg,var(--accent),var(--accent2));
    border: 0;
}

/* CODE */

.code-block {
    margin-top: 12px;
    background: #05060a;
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    position: relative;
}

.code-header {
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--border);
    color: #9298ad;
    font-size: 11px;
}

.code-header button {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06);
    color: white;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 10px;
}

.code-block pre {
    margin: 0;
    padding: 15px;
    overflow-x: auto;
}

.code-block code {
    font-family: Consolas,Monaco,monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre;
}

/* GAME PLAYER */

.game-container {
    margin-top: 14px;
    border: 1px solid rgba(124,92,255,.25);
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 70px rgba(0,0,0,.35);
}

.game-toolbar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 14px;
    background: rgba(18,20,31,.95);
    border-bottom: 1px solid var(--border);
}

.game-toolbar strong {
    font-size: 12px;
}

.game-toolbar button {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06);
    color: white;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 10px;
}

.game-frame {
    width: 100%;
    height: 560px;
    border: 0;
    display: block;
    background: #000;
}

/* TYPING */

.typing {
    display: inline-flex;
    gap: 4px;
    padding: 10px 0;
}

.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #a9b0c8;
    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    50% {
        transform: translateY(-4px);
        opacity: .45;
    }
}

/* COMPOSER */

.composer-wrap {
    position: absolute;
    bottom: 0;
    left: 285px;
    right: 0;
    padding: 20px 20px 22px;
    background: linear-gradient(
        transparent,
        rgba(7,8,13,.95) 35%
    );
}

.composer {
    width: min(900px,100%);
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 9px;
    border-radius: 19px;
    background: rgba(18,20,31,.88);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 70px rgba(0,0,0,.45);
    backdrop-filter: blur(20px);
}

textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 180px;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    padding: 12px 10px;
    line-height: 1.4;
}

textarea::placeholder {
    color: #71778c;
}

.send {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 13px;
    color: white;
    background: linear-gradient(135deg,var(--accent),var(--accent2));
    font-weight: 900;
    box-shadow: 0 0 25px rgba(124,92,255,.22);
    transition: .2s;
}

.send:hover {
    transform: scale(1.05);
}

.send:disabled {
    opacity: .45;
}

/* MOBILE */

.mobile-menu {
    display: none;
}

@media (max-width:760px) {

    .sidebar {
        position: fixed;
        left: -300px;
        top: 0;
        transition: .25s;
        box-shadow: 20px 0 60px rgba(0,0,0,.45);
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.04);
        color: white;
        border-radius: 10px;
        padding: 8px 10px;
        margin-right: 10px;
    }

    .topbar {
        padding: 0 12px;
    }

    .composer-wrap {
        left: 0;
        padding: 12px;
    }

    .messages {
        padding-left: 12px;
        padding-right: 12px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .welcome {
        min-height: 60vh;
    }

    .welcome h1 {
        font-size: 38px;
    }

    .content {
        max-width: 94%;
    }

    .game-frame {
        height: 450px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="logo">S</div>

            <div class="brand-text">
                <strong>SkidGPT</strong>
                <span>AI • Game Creator</span>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="section-title">
            Recent conversations
        </div>

        <div class="chat-list" id="chatList"></div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="model">

                <button
                    class="mobile-menu"
                    onclick="toggleSidebar()">
                    ☰
                </button>

                <span class="status-dot"></span>

                <div>
                    <strong>SkidGPT</strong>
                    <span>Online</span>
                </div>

            </div>

            <div class="top-actions">
                <button onclick="newChat()">
                    New
                </button>
            </div>

        </header>

        <section class="messages" id="messages">

            <div
                class="messages-inner"
                id="messagesInner">
            </div>

        </section>

        <div class="composer-wrap">

            <form
                class="composer"
                id="chatForm">

                <textarea
                    id="input"
                    placeholder="Message SkidGPT..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <button
                    class="send"
                    id="send"
                    type="submit">
                    ↑
                </button>

            </form>

        </div>

    </main>

</div>

<script>
const input = document.getElementById("input");
const form = document.getElementById("chatForm");
const sendButton = document.getElementById("send");
const messagesInner = document.getElementById("messagesInner");
const chatList = document.getElementById("chatList");
const sidebar = document.getElementById("sidebar");

let conversations = JSON.parse(
    localStorage.getItem("skidgpt_conversations") || "[]"
);

let currentConversation = null;

/* -------------------------
   STORAGE
------------------------- */

function saveConversations() {
    localStorage.setItem(
        "skidgpt_conversations",
        JSON.stringify(conversations)
    );
}

/* -------------------------
   CONVERSATIONS
------------------------- */

function createConversation() {
    return {
        id: Date.now().toString(),
        title: "New conversation",
        preview: "No messages yet",
        messages: [],
        createdAt: Date.now()
    };
}

function newChat() {

    currentConversation = createConversation();

    conversations.unshift(currentConversation);

    saveConversations();

    renderChatList();
    renderCurrentChat();

    input.focus();

    sidebar.classList.remove("open");
}

function loadConversation(id) {

    const conversation =
        conversations.find(
            chat => chat.id === id
        );

    if (!conversation) return;

    currentConversation = conversation;

    renderChatList();
    renderCurrentChat();

    sidebar.classList.remove("open");
}

function deleteConversation(id,event) {

    event.stopPropagation();

    conversations =
        conversations.filter(
            chat => chat.id !== id
        );

    if (
        currentConversation &&
        currentConversation.id === id
    ) {
        currentConversation = null;
    }

    saveConversations();

    renderChatList();
    renderCurrentChat();
}

function generateTitle(text) {

    let clean = text
        .replace(/\s+/g," ")
        .trim();

    if (!clean) {
        return "New conversation";
    }

    if (clean.length > 38) {
        clean =
            clean.substring(0,38) + "...";
    }

    return clean;
}

/* -------------------------
   CHAT LIST
------------------------- */

function renderChatList() {

    chatList.innerHTML = "";

    conversations.forEach(conversation => {

        const item =
            document.createElement("div");

        item.className =
            "chat-item " +
            (
                currentConversation &&
                currentConversation.id === conversation.id
                    ? "active"
                    : ""
            );

        item.onclick = () =>
            loadConversation(conversation.id);

        const title =
            document.createElement("div");

        title.className = "chat-title";
        title.textContent =
            conversation.title;

        const preview =
            document.createElement("div");

        preview.className = "chat-preview";
        preview.textContent =
            conversation.preview;

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-chat";

        deleteButton.textContent = "×";

        deleteButton.onclick =
            event =>
                deleteConversation(
                    conversation.id,
                    event
                );

        item.appendChild(title);
        item.appendChild(preview);
        item.appendChild(deleteButton);

        chatList.appendChild(item);
    });
}

/* -------------------------
   WELCOME SCREEN
------------------------- */

function welcomeHTML() {

    return `
        <div class="welcome">

            <div class="welcome-orb">
                S
            </div>

            <h1>
                Meet
                <span class="gradient-text">
                    SkidGPT
                </span>
            </h1>

            <p>
                Your AI assistant for questions,
                coding, ideas, and creating
                complete browser games.
            </p>

            <div class="cards">

                <button
                    class="suggestion"
                    onclick="useSuggestion(
                        'Make me a polished horror game set inside an abandoned facility.'
                    )">

                    <strong>
                        🎮 Create a game
                    </strong>

                    <span>
                        Build a complete playable game
                    </span>

                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion(
                        'Help me make my Unity game better.'
                    )">

                    <strong>
                        🛠️ Help with code
                    </strong>

                    <span>
                        Get help with your projects
                    </span>

                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion(
                        'Give me 5 creative game ideas.'
                    )">

                    <strong>
                        💡 Brainstorm
                    </strong>

                    <span>
                        Turn ideas into something awesome
                    </span>

                </button>

            </div>

        </div>
    `;
}

/* -------------------------
   RENDER CURRENT CHAT
------------------------- */

function renderCurrentChat() {

    messagesInner.innerHTML = "";

    if (
        !currentConversation ||
        currentConversation.messages.length === 0
    ) {
        messagesInner.innerHTML =
            welcomeHTML();

        return;
    }

    currentConversation.messages.forEach(
        message => {

            addMessageToScreen(
                message.role,
                message.content,
                message.type,
                message.gameHTML
            );

        }
    );

    scrollToBottom();
}

/* -------------------------
   MESSAGE DISPLAY
------------------------- */

function addMessageToScreen(
    role,
    content,
    type = "text",
    gameHTML = null
) {

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (role === "user"
            ? "user"
            : "ai");

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "user"
            ? "YOU"
            : "S";

    const contentBox =
        document.createElement("div");

    contentBox.className = "content";

    if (
        role === "assistant" &&
        type === "game"
    ) {

        addGameContent(
            contentBox,
            content,
            gameHTML
        );

    } else {

        addTextContent(
            contentBox,
            content
        );

    }

    message.appendChild(avatar);
    message.appendChild(contentBox);

    messagesInner.appendChild(message);
}

/* -------------------------
   NORMAL TEXT + CODE
------------------------- */

function addTextContent(
    container,
    content
) {

    const parts =
        content.split(/```([\s\S]*?)```/g);

    for (
        let i = 0;
        i < parts.length;
        i++
    ) {

        const part = parts[i];

        if (!part.trim()) continue;

        if (i % 2 === 1) {

            let code = part;

            let language = "code";

            const firstLine =
                code.match(
                    /^\s*([a-zA-Z0-9+#-]+)\s*\n/
                );

            if (firstLine) {

                language =
                    firstLine[1];

                code =
                    code.substring(
                        firstLine[0].length
                    );
            }

            const block =
                document.createElement("div");

            block.className =
                "code-block";

            const header =
                document.createElement("div");

            header.className =
                "code-header";

            const label =
                document.createElement("span");

            label.textContent =
                language;

            const copy =
                document.createElement("button");

            copy.textContent =
                "📋 Copy";

            copy.onclick =
                () => copyText(
                    code,
                    copy
                );

            header.appendChild(label);
            header.appendChild(copy);

            const pre =
                document.createElement("pre");

            const codeElement =
                document.createElement("code");

            codeElement.textContent =
                code.trim();

            pre.appendChild(codeElement);

            block.appendChild(header);
            block.appendChild(pre);

            container.appendChild(block);

        } else {

            const text =
                document.createElement("div");

            text.className = "text";

            text.textContent =
                part.trim();

            container.appendChild(text);
        }
    }
}

/* -------------------------
   GAME CONTENT
------------------------- */

function addGameContent(
    container,
    html,
    playable
) {

    const title =
        document.createElement("div");

    title.className = "text";

    title.textContent =
        "🎮 Your game is ready!";

    container.appendChild(title);

    if (playable) {

        createGamePlayer(
            container,
            html
        );
    }

    if (!playable || playable === "both") {

        createCodeBlock(
            container,
            html
        );
    }
}

/* -------------------------
   GAME PLAYER
------------------------- */

function createGamePlayer(
    container,
    html
) {

    const gameContainer =
        document.createElement("div");

    gameContainer.className =
        "game-container";

    const toolbar =
        document.createElement("div");

    toolbar.className =
        "game-toolbar";

    const label =
        document.createElement("strong");

    label.textContent =
        "🎮 PLAY GAME";

    const reload =
        document.createElement("button");

    reload.textContent =
        "↻ Restart";

    toolbar.appendChild(label);
    toolbar.appendChild(reload);

    const frame =
        document.createElement("iframe");

    frame.className =
        "game-frame";

    frame.setAttribute(
        "sandbox",
        "allow-scripts allow-pointer-lock"
    );

    frame.srcdoc = html;

    reload.onclick = () => {
        frame.srcdoc = html;
    };

    gameContainer.appendChild(toolbar);
    gameContainer.appendChild(frame);

    container.appendChild(gameContainer);
}

/* -------------------------
   CODE BLOCK
------------------------- */

function createCodeBlock(
    container,
    code
) {

    const block =
        document.createElement("div");

    block.className =
        "code-block";

    const header =
        document.createElement("div");

    header.className =
        "code-header";

    const label =
        document.createElement("span");

    label.textContent =
        "HTML GAME";

    const copy =
        document.createElement("button");

    copy.textContent =
        "📋 Copy";

    copy.onclick =
        () => copyText(
            code,
            copy
        );

    header.appendChild(label);
    header.appendChild(copy);

    const pre =
        document.createElement("pre");

    const codeElement =
        document.createElement("code");

    codeElement.textContent =
        code;

    pre.appendChild(codeElement);

    block.appendChild(header);
    block.appendChild(pre);

    container.appendChild(block);
}

/* -------------------------
   COPY
------------------------- */

async function copyText(
    text,
    button
) {

    try {

        await navigator.clipboard.writeText(
            text
        );

        const old =
            button.textContent;

        button.textContent =
            "✓ Copied!";

        setTimeout(() => {
            button.textContent = old;
        },1500);

    } catch {

        const area =
            document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        button.textContent =
            "✓ Copied!";

        setTimeout(() => {
            button.textContent =
                "📋 Copy";
        },1500);
    }
}

/* -------------------------
   TYPING
------------------------- */

function addTyping() {

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "typingMessage";

    message.innerHTML = `
        <div class="avatar">S</div>

        <div class="content">

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    messagesInner.appendChild(message);

    scrollToBottom();
}

function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {
        typing.remove();
    }
}

/* -------------------------
   GAME DETECTION
------------------------- */

function looksLikeGameRequest(
    text
) {

    return /\b(make|create|build|generate|design|develop)\b.{0,100}\b(game|platformer|shooter|horror|rpg|racing|clicker|pong|snake|flappy|arcade|survival)\b/i.test(text)
        || /\b(game|platformer|shooter|horror|rpg|racing|clicker|pong|snake|flappy|arcade|survival)\b/i.test(text);
}

/* -------------------------
   GAME CHOICE
------------------------- */

function showGameChoice(
    request
) {

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";
    avatar.textContent = "S";

    const content =
        document.createElement("div");

    content.className = "content";

    const choice =
        document.createElement("div");

    choice.className =
        "game-choice";

    choice.innerHTML = `
        <div class="game-choice-title">
            🎮 Game request detected
        </div>

        <div class="game-choice-subtitle">
            How do you want SkidGPT to create it?
        </div>

        <div class="game-choice-buttons">

            <button
                class="primary"
                onclick='chooseGameMode("play", ${JSON.stringify(request)})'>
                🎮 Play Game
            </button>

            <button
                onclick='chooseGameMode("script", ${JSON.stringify(request)})'>
                💻 Get Script
            </button>

            <button
                onclick='chooseGameMode("both", ${JSON.stringify(request)})'>
                🚀 Both
            </button>

        </div>
    `;

    content.appendChild(choice);

    message.appendChild(avatar);
    message.appendChild(content);

    messagesInner.appendChild(message);

    scrollToBottom();
}

/* -------------------------
   CHOOSE GAME MODE
------------------------- */

async function chooseGameMode(
    mode,
    request
) {

    const buttons =
        document.querySelectorAll(
            ".game-choice-buttons button"
        );

    buttons.forEach(
        button =>
            button.disabled = true
    );

    const modeNames = {
        play: "🎮 Play Game",
        script: "💻 Get Script",
        both: "🚀 Both"
    };

    addUserMessageToConversation(
        `${modeNames[mode]} — ${request}`
    );

    renderCurrentChat();

    addTyping();

    sendButton.disabled = true;

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: request,
                    mode: "game",
                    conversation:
                        currentConversation.messages
                })
            });

        const data =
            await response.json();

        removeTyping();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Game generation failed."
            );
        }

        const html =
            data.reply || "";

        currentConversation.messages.push({
            role: "assistant",
            content: html,
            type: "game",
            gameHTML:
                mode === "play"
                    ? "play"
                    : mode === "both"
                        ? "both"
                        : null
        });

        currentConversation.preview =
            "Generated a game";

        saveConversations();

        renderChatList();
        renderCurrentChat();

    } catch (error) {

        removeTyping();

        currentConversation.messages.push({
            role: "assistant",
            content:
                "Sorry, I couldn't create the game.\n\n" +
                error.message
        });

        saveConversations();

        renderCurrentChat();

    } finally {

        sendButton.disabled = false;

        input.focus();
    }
}

/* -------------------------
   ADD USER MESSAGE
------------------------- */

function addUserMessageToConversation(
    text
) {

    currentConversation.messages.push({
        role: "user",
        content: text,
        type: "text"
    });

    currentConversation.preview =
        text.substring(0,70);

    saveConversations();
}

/* -------------------------
   SEND MESSAGE
------------------------- */

async function sendMessage(
    text
) {

    text = text.trim();

    if (!text) return;

    if (!currentConversation) {

        currentConversation =
            createConversation();

        conversations.unshift(
            currentConversation
        );
    }

    if (
        currentConversation.messages.length === 0
    ) {

        currentConversation.title =
            generateTitle(text);
    }

    /*
       If this looks like a game request,
       show the choice menu first.
    */

    if (looksLikeGameRequest(text)) {

        addUserMessageToConversation(text);

        renderChatList();
        renderCurrentChat();

        showGameChoice(text);

        input.value = "";
        input.style.height = "auto";

        return;
    }

    addUserMessageToConversation(text);

    renderChatList();
    renderCurrentChat();

    addTyping();

    input.value = "";
    input.style.height = "auto";

    sendButton.disabled = true;

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text,
                    mode: "chat",
                    conversation:
                        currentConversation.messages
                })
            });

        const data =
            await response.json();

        removeTyping();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "AI request failed."
            );
        }

        const reply =
            data.reply ||
            "I didn't receive a response.";

        currentConversation.messages.push({
            role: "assistant",
            content: reply,
            type: "text"
        });

        currentConversation.preview =
            reply.substring(0,70);

        saveConversations();

        renderChatList();
        renderCurrentChat();

    } catch (error) {

        removeTyping();

        currentConversation.messages.push({
            role: "assistant",
            content:
                "Sorry, something went wrong:\n\n" +
                error.message,
            type: "text"
        });

        saveConversations();

        renderCurrentChat();

    } finally {

        sendButton.disabled = false;

        input.focus();
    }
}

/* -------------------------
   INPUT
------------------------- */

form.addEventListener(
    "submit",
    event => {

        event.preventDefault();

        sendMessage(
            input.value
        );
    }
);

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) + "px";
    }
);

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            form.requestSubmit();
        }
    }
);

/* -------------------------
   SUGGESTIONS
------------------------- */

function useSuggestion(text) {

    input.value = text;

    input.focus();

    form.requestSubmit();
}

/* -------------------------
   MOBILE SIDEBAR
------------------------- */

function toggleSidebar() {

    sidebar.classList.toggle(
        "open"
    );
}

/* -------------------------
   SCROLL
------------------------- */

function scrollToBottom() {

    const messages =
        document.getElementById(
            "messages"
        );

    setTimeout(() => {

        messages.scrollTo({
            top:
                messages.scrollHeight,
            behavior:
                "smooth"
        });

    },30);
}

/* -------------------------
   STARTUP
------------------------- */

renderChatList();

if (conversations.length > 0) {

    currentConversation =
        conversations[0];
}

renderCurrentChat();
</script>
